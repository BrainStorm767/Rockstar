<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login Failed</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f1f2e, #0b0b12);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .box {
      width: 380px;
      padding: 30px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 0 30px rgba(255,0,0,0.2);
      animation: shakeIn 0.5s ease;
    }

    h2 {
      color: #ff4d4d;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      background: linear-gradient(90deg, #ff4d4d, #ff1a75);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,0,0,0.4);
    }

    @keyframes shakeIn {
      0% { transform: translateX(-10px); opacity: 0; }
      50% { transform: translateX(10px); }
      100% { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>❌ Login Failed</h2>
    <p>Wrong admin password. Please try again.</p>

    <a href="/admin">Try Again</a>
  </div>

</body>

</html>
